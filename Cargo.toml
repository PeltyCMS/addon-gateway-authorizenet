[package]
name = "pelty-addon-gateway-authorizenet"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["export"]
export = []

[dependencies]
pelty-addon-sdk = { workspace = true, features = ["gateway"] }
pelty-payments = { path = "../../../crates/pelty-payments" }
pelty-core = { path = "../../../crates/pelty-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1", features = ["serde-str"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
subtle = "2"

[dev-dependencies]
pelty-payments = { path = "../../../crates/pelty-payments", features = ["test-util"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
